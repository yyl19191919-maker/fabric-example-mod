name: Build XynisClient 1.20.2

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Find and Extract ZIP
        run: |
          echo "=== Searching for ZIP files ==="
          ls -la
          
          # البحث عن أي ملف ZIP
          ZIP_FILE=""
          if [ -f "XynisClient-Complete.zip" ]; then
            ZIP_FILE="XynisClient-Complete.zip"
            echo "Found: XynisClient-Complete.zip"
          elif [ -f "src.zip" ]; then
            ZIP_FILE="src.zip"
            echo "Found: src.zip"
          elif ls *.zip 1>/dev/null 2>&1; then
            ZIP_FILE=$(ls *.zip | head -1)
            echo "Found: $ZIP_FILE"
          else
            echo "ERROR: No ZIP file found in repository!"
            echo "Please upload XynisClient-Complete.zip to this repository"
            exit 1
          fi
          
          echo "=== Extracting $ZIP_FILE ==="
          unzip -o "$ZIP_FILE" -d /tmp/extract
          
          echo "=== Extracted Contents ==="
          find /tmp/extract -type f | head -30
          
          # إنشاء المجلدات
          mkdir -p src/main/java/us
          mkdir -p src/main/resources
          
          # نقل الملفات حسب البنية
          if [ -d "/tmp/extract/us/whitedev" ]; then
            echo "Found: /us/whitedev structure"
            cp -r /tmp/extract/us/whitedev src/main/java/us/
          elif [ -d "/tmp/extract/src/us/whitedev" ]; then
            echo "Found: /src/us/whitedev structure"
            cp -r /tmp/extract/src/us/whitedev src/main/java/us/
          elif [ -d "/tmp/extract/whitedev" ]; then
            echo "Found: /whitedev structure"
            cp -r /tmp/extract/whitedev src/main/java/us/
          else
            echo "ERROR: Cannot find whitedev directory in ZIP!"
            echo "ZIP structure:"
            find /tmp/extract -type d | head -20
            exit 1
          fi
          
          # نقل dependencies
          if [ -d "/tmp/extract/META-INF/jars" ]; then
            echo "Found META-INF/jars"
            mkdir -p libs
            cp -r /tmp/extract/META-INF/jars/* libs/
          fi
          
          echo "=== .class files count ==="
          find src -name "*.class" | wc -l

      - name: Create JAR manually
        run: |
          echo "=== Building JAR for Minecraft 1.20.2 ==="
          
          mkdir -p build/libs
          
          # إنشاء manifest
          cat > manifest.mf <<'EOF'
          Manifest-Version: 1.0
          Main-Class: us.whitedev.XynisClient
          Implementation-Version: 6.4-enhanced
          EOF
          
          # إنشاء JAR
          cd /tmp/extract
          jar cfm $GITHUB_WORKSPACE/build/libs/xynis-client-6.4-enhanced-1.20.2.jar $GITHUB_WORKSPACE/manifest.mf .
          cd $GITHUB_WORKSPACE
          
          echo "=== JAR Created ==="
          ls -lh build/libs/
          
          # التحقق
          echo "=== JAR Contents (first 20) ==="
          jar tf build/libs/xynis-client-6.4-enhanced-1.20.2.jar | head -20

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xynis-client-1.20.2
          path: build/libs/*.jar

      - name: Build Info
        run: |
          echo "=== Build Info ==="
          echo "Minecraft: 1.20.2"
          echo "Java: 21"
          echo "Status: SUCCESS ✅"
